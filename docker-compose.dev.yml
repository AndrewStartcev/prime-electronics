name: prime-local

services:
  postgres:
    image: postgres:18-alpine
    container_name: prime-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: prime_local
      POSTGRES_USER: prime
      POSTGRES_PASSWORD: prime_local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - prime_postgres_data:/var/lib/postgresql
      - ./dev-data:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prime -d prime_local"]
      interval: 3s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7-alpine
    container_name: prime-local-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "prime_local_redis"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - prime_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "prime_local_redis", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  prime_postgres_data:
    name: prime-local-postgres-data
  prime_redis_data:
    name: prime-local-redis-data
